[project]
name = "mrob-academic-review"
version = "0.1.0"
description = "Provenance-preserving Stage 1A literature candidate corpus for the MROB TFM."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "rapidfuzz>=3.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
