schema_version: sp1-n2-confirmatory-v1
campaign_id: SP1_N2_HETEROGENEOUS_CONFIRMATORY_v1
status: frozen_before_run
created_utc: 2026-08-08
base_seed: 2026080801
q_bar_kg: 5.0
workspace_m: [100.0, 100.0]

# N2 changes exactly one hypothesis of N1: robots keep an individual capacity.
# The primary oracle therefore minimizes distance only, so that any comparison
# with the frozen N1 LSAP isolates the model change from an objective change.
objective:
  lambda_excess: 0.0
  lambda_robot: 0.0
  sensitivity_lambda_excess: 0.25
  sensitivity_lambda_robot: 0.001

# Capacities are lognormal, renormalized so total supply is exactly N*q_bar at
# every CV. Demand is a Dirichlet split of rho*supply.
generator:
  capacity_distribution: lognormal_renormalized
  demand_split_alpha: 3.0
  fractional_tolerance: 1.0e-6

hypotheses:
  oracle:
    id: H-N2.O
    alternative: HiGHS reproduces exhaustive enumeration on small instances
    test: deterministic identity check within numerical tolerance
  homogeneous_limit:
    id: H-N2.H
    alternative: with c_i = c the N2 optimum equals the frozen N1 LSAP distance
    test: deterministic paired identity check
  atomicity:
    id: H-N2.A
    alternative: the LP relaxation is strictly better than any atomic coalition
    test: paired integrality gap with bootstrap 95% interval
  phase:
    id: H-N2.P
    alternative: feasibility depends on pressure and on heterogeneity
    test: per-cell Wilson intervals plus a clustered logistic trend
  certification:
    id: H-N2.C
    alternative: certified optimality degrades with instance size
    test: descriptive rates, runtime quantiles and censored MIP gaps

analysis:
  confidence_level: 0.95
  bootstrap_resamples: 4000

# E1.A brute force ceiling comes from the pilot: (K+1)^N states, 5M budget.
oracle_validation:
  sizes: [[8, 2], [8, 3], [10, 2], [10, 3], [11, 3]]
  capacity_cv: [0.35, 0.65, 1.00]
  pressure: [0.60, 0.80]
  scenario: uniform
  seeds_per_cell: 25
  enumeration_max_states: 5000000
  milp_time_limit_s: 30.0

homogeneous_limit:
  slots: [12, 24]
  scenarios: [uniform, clustered, separated, ring, corridor]
  quota_mode: moderate
  reserve_delta: 0.20
  seeds_per_cell: 25
  milp_time_limit_s: 30.0

atomicity:
  robot_count: 16
  load_count: 5
  capacity_cv: [0.00, 0.15, 0.35, 0.65, 1.00]
  pressure: [0.70, 0.85]
  scenarios: [uniform, clustered, separated, ring, corridor]
  seeds_per_cell: 30
  milp_time_limit_s: 30.0

phase_diagram:
  robot_count: 24
  load_count: 8
  capacity_cv: [0.00, 0.15, 0.35, 0.65, 1.00]
  pressure: [0.60, 0.75, 0.85, 0.92, 0.97, 1.02]
  scenarios: [uniform, clustered, separated, ring, corridor]
  seeds_per_cell: 12
  milp_time_limit_s: 10.0

certification:
  sizes: [[20, 6], [30, 9], [40, 12], [50, 15], [60, 18], [80, 24]]
  capacity_cv: 0.65
  pressure: 0.85
  scenario: uniform
  seeds_per_cell: 15
  time_limits_s: [1.0, 5.0]

limitations:
  - The oracle needs global knowledge of positions, capacities and demands.
  - Certified optimality is a solver property under a wall-clock budget.
  - The LP relaxation bounds the objective; it is not a physical plan.
  - Transport, contact and wrench remain out of scope until SP2.
