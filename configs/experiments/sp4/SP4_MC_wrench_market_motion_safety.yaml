experiment_id: SP4_MC_wrench_market_motion_safety
mode: monte_carlo
description: "Wrench-market-games inspired SP4 diagnostic: positive-correlation motion fields, primal-dual/PID/tensor-flow safety, and quality-resource tradeoffs after allocation."
output_dir: results/sp4/SP4_MC_wrench_market_motion_safety

seeds:
  start: 5400
  count: 50

scenarios:
  - param_generator: open_field_arrival
  - param_generator: crossing_traffic
  - param_generator: narrow_passage
  - param_generator: cluttered_warehouse
  - param_generator: communication_limited
  - param_generator: long_distance_energy

methods:
  - id: direct_to_target
  - id: priority_yield
  - id: apf_obstacle_avoidance
  - id: velocity_obstacle_proxy
  - id: cbf_safety_filter
  - id: smith_motion_field
  - id: replicator_motion_field
  - id: logit_motion_field
  - id: bnn_motion_field
  - id: primal_dual_motion_field
  - id: pid_safety_motion
  - id: tensor_flow_motion_field
  - id: reference_time_expanded_cbf

hypotheses:
  - id: H_WMG_SP4_reference_collision_lower_than_direct
    metric: collision_rate
    method_a: reference_time_expanded_cbf
    method_b: direct_to_target
    direction: less
    alpha: 0.05

  - id: H_WMG_SP4_tensor_collision_lower_than_direct
    metric: collision_rate
    method_a: tensor_flow_motion_field
    method_b: direct_to_target
    direction: less
    alpha: 0.05

  - id: H_WMG_SP4_primal_dual_gap_lower_than_apf
    metric: performance_gap_vs_reference
    method_a: primal_dual_motion_field
    method_b: apf_obstacle_avoidance
    direction: less
    alpha: 0.05

  - id: H_WMG_SP4_motion_engines_differ_diagnostic
    metric: performance_gap_vs_reference
    methods:
      - replicator_motion_field
      - logit_motion_field
      - bnn_motion_field
      - smith_motion_field
      - primal_dual_motion_field
      - pid_safety_motion
      - tensor_flow_motion_field
    alpha: 0.05

trajectory_sample_runs: 8

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 26
    final_hold_s: 6
    max_per_scenario: 4
    selection_metric: arrival_success_rate
