experiment_id: SP4_MC_explicit_control_law
mode: monte_carlo
output_dir: results/sp4/SP4_MC_explicit_control_law

seeds:
  start: 5400
  count: 12

scenarios:
  - param_generator: open_field_arrival
  - param_generator: crossing_traffic
  - param_generator: narrow_passage
  - param_generator: cluttered_warehouse
  - param_generator: communication_limited
  - param_generator: long_distance_energy

methods:
  - id: direct_to_target
  - id: cbf_safety_filter
  - id: tensor_flow_motion_field
  - id: explicit_vgne_cbf_motion
  - id: smith_motion_field
  - id: reference_time_expanded_cbf

hypotheses:
  - id: H4E_1_explicit_reduces_collision_vs_direct
    metric: collision_rate
    method_a: explicit_vgne_cbf_motion
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4E_2_explicit_reduces_gap_vs_cbf
    metric: performance_gap_vs_reference
    method_a: explicit_vgne_cbf_motion
    method_b: cbf_safety_filter
    direction: less
    alpha: 0.05
  - id: H4E_3_explicit_family_differs
    metric: score_value
    methods:
      - direct_to_target
      - cbf_safety_filter
      - tensor_flow_motion_field
      - explicit_vgne_cbf_motion
      - smith_motion_field
    alpha: 0.05

trajectory_sample_runs: 12

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 16
    final_hold_s: 4
    max_per_scenario: 1
    selection_metric: arrival_success_rate
