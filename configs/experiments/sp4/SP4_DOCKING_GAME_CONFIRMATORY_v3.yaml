experiment_id: SP4_DOCKING_GAME_CONFIRMATORY_v3
mode: confirmatory
description: "Canonical candidate after repairing collision-free initial-world generation; frozen after PILOT_v3."
output_dir: results/sp4/SP4_DOCKING_GAME_CONFIRMATORY_v3
audit_worlds: 6

seeds:
  start: 474100
  count: 6

scenarios:
  - id: open_docking
  - id: crossing
  - id: narrow_passage
  - id: cluttered_docking
  - id: symmetric_deadlock
  - id: actuator_limited

robot_counts: [4, 8, 12]

methods:
  - id: direct_to_slot
  - id: apf_navigation
  - id: rvo_proxy
  - id: cbf_qp
  - id: central_potential_reference
  - id: nash_pd_exact_raw
  - id: nash_pd_exact
  - id: nash_pd_ring
  - id: smith_primitives
  - id: replicator_primitives
  - id: erv_bnn_primitives

simulation:
  dt_s: 0.16
  horizon_s: 35.0
  barrier_gamma: 2.6
  barrier_iterations: 30

game:
  steps: 20
  replan_interval_steps: 3
  central_steps: 70
  audit_steps: 260
  primal_dt: 0.12
  dual_dt: 0.10
  congestion_weight: 0.38
  regularization: 0.04
  consensus_rounds: 4
  tolerance: 0.001

audit_gates:
  max_simplex_error: 1.0e-9
  max_capacity_violation: 0.08
  max_qp_potential_gap: 0.025
  max_potential_gradient_error: 1.0e-5
  min_initial_clearance_m: 0.0

hypotheses:
  - id: H4_1_replicator_safe_success_above_cbf
    metric: safe_docking_success
    method_a: replicator_primitives
    method_b: cbf_qp
    direction: greater
  - id: H4_2_replicator_collision_below_direct
    metric: any_collision
    method_a: replicator_primitives
    method_b: direct_to_slot
    direction: less
  - id: H4_3_exact_kkt_below_ring
    metric: final_kkt_residual
    method_a: nash_pd_exact
    method_b: nash_pd_ring
    direction: less
  - id: H4_4_replicator_safe_success_above_nash_pd
    metric: safe_docking_success
    method_a: replicator_primitives
    method_b: nash_pd_exact
    direction: greater
  - id: H4_5_replicator_position_error_below_central
    metric: final_position_error_m
    method_a: replicator_primitives
    method_b: central_potential_reference
    direction: less