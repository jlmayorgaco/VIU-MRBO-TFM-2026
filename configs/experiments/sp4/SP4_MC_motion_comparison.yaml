experiment_id: SP4_MC_motion_comparison
mode: monte_carlo
output_dir: results/sp4/SP4_MC_motion_comparison

seeds:
  start: 5100
  count: 50

scenarios:
  - param_generator: open_field_arrival
  - param_generator: crossing_traffic
  - param_generator: narrow_passage
  - param_generator: cluttered_warehouse
  - param_generator: communication_limited
  - param_generator: long_distance_energy

methods:
  - id: direct_to_target
  - id: priority_yield
  - id: apf_obstacle_avoidance
  - id: velocity_obstacle_proxy
  - id: cbf_safety_filter
  - id: smith_motion_field
  - id: energy_aware_smith_motion
  - id: reference_time_expanded_cbf

hypotheses:
  - id: H4_1_reference_reduces_collision_vs_direct
    metric: collision_rate
    method_a: reference_time_expanded_cbf
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4_2_smith_reduces_collision_vs_direct
    metric: collision_rate
    method_a: smith_motion_field
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4_3_energy_smith_reduces_energy_vs_cbf
    metric: energy_proxy_wh
    method_a: energy_aware_smith_motion
    method_b: cbf_safety_filter
    direction: less
    alpha: 0.05
  - id: H4_4_methods_differ_gap_vs_reference
    metric: performance_gap_vs_reference
    methods:
      - direct_to_target
      - priority_yield
      - apf_obstacle_avoidance
      - velocity_obstacle_proxy
      - cbf_safety_filter
      - smith_motion_field
      - energy_aware_smith_motion
    alpha: 0.05

trajectory_sample_runs: 18

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 26
    final_hold_s: 6
    max_per_scenario: 4
    selection_metric: arrival_success_rate
