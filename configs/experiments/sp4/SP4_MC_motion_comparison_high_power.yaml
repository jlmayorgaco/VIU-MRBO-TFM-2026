experiment_id: SP4_MC_motion_comparison_high_power
mode: monte_carlo
description: "High-power SP4 motion/control Monte Carlo. Uses all implemented SP4 methods and all six canonical motion scenarios; seed count is chosen to exceed 20,000 rollouts while preserving the comparison surface."
output_dir: results/sp4/SP4_MC_motion_comparison_high_power

seeds:
  start: 5600
  count: 223

scenarios:
  - param_generator: open_field_arrival
  - param_generator: crossing_traffic
  - param_generator: narrow_passage
  - param_generator: cluttered_warehouse
  - param_generator: communication_limited
  - param_generator: long_distance_energy

methods:
  - id: direct_to_target
  - id: priority_yield
  - id: apf_obstacle_avoidance
  - id: velocity_obstacle_proxy
  - id: cbf_safety_filter
  - id: replicator_motion_field
  - id: logit_motion_field
  - id: bnn_motion_field
  - id: primal_dual_motion_field
  - id: pid_safety_motion
  - id: tensor_flow_motion_field
  - id: explicit_vgne_cbf_motion
  - id: smith_motion_field
  - id: energy_aware_smith_motion
  - id: reference_time_expanded_cbf

hypotheses:
  - id: H4_HP_1_reference_reduces_collision_vs_direct
    metric: collision_rate
    method_a: reference_time_expanded_cbf
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4_HP_2_cbf_reduces_collision_vs_direct
    metric: collision_rate
    method_a: cbf_safety_filter
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4_HP_3_tensor_reduces_collision_vs_direct
    metric: collision_rate
    method_a: tensor_flow_motion_field
    method_b: direct_to_target
    direction: less
    alpha: 0.05
  - id: H4_HP_4_energy_smith_reduces_energy_vs_cbf
    metric: energy_proxy_wh
    method_a: energy_aware_smith_motion
    method_b: cbf_safety_filter
    direction: less
    alpha: 0.05
  - id: H4_HP_5_methods_differ_gap_vs_reference
    metric: performance_gap_vs_reference
    methods:
      - direct_to_target
      - priority_yield
      - apf_obstacle_avoidance
      - velocity_obstacle_proxy
      - cbf_safety_filter
      - replicator_motion_field
      - logit_motion_field
      - bnn_motion_field
      - primal_dual_motion_field
      - pid_safety_motion
      - tensor_flow_motion_field
      - explicit_vgne_cbf_motion
      - smith_motion_field
      - energy_aware_smith_motion
    alpha: 0.05

trajectory_sample_runs: 24

artifacts:
  save_video: false
