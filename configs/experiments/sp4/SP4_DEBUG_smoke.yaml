experiment_id: SP4_DEBUG_smoke
mode: monte_carlo
output_dir: results/sp4/SP4_DEBUG_smoke

seeds:
  start: 5100
  count: 2

scenarios:
  - param_generator: open_field_arrival
  - param_generator: crossing_traffic
  - param_generator: narrow_passage

methods:
  - id: direct_to_target
  - id: priority_yield
  - id: cbf_safety_filter
  - id: smith_motion_field
  - id: replicator_motion_field
  - id: logit_motion_field
  - id: bnn_motion_field
  - id: primal_dual_motion_field
  - id: pid_safety_motion
  - id: tensor_flow_motion_field
  - id: reference_time_expanded_cbf

hypotheses:
  - id: H4_DEBUG_reference_collision_not_worse_than_direct
    metric: collision_rate
    method_a: reference_time_expanded_cbf
    method_b: direct_to_target
    direction: less
    alpha: 0.05

trajectory_sample_runs: 4

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 26
    final_hold_s: 6
    max_per_scenario: 2
    selection_metric: arrival_success_rate
