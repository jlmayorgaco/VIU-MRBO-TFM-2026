experiment_id: SP1_DIAG_wrench_market_protocol_repair
mode: monte_carlo
description: "Fast diagnostic for Wrench-Market SP1 protocol/repair methods without video generation."
output_dir: results/sp1/SP1_DIAG_wrench_market_protocol_repair

scenarios:
  - id: SP1_recruitment
    param_generator: under_demand
  - id: SP1_recruitment
    param_generator: balanced_demand
  - id: SP1_recruitment
    param_generator: over_demand
  - id: SP1_recruitment
    param_generator: monte_carlo

methods:
  - id: centralized_coalition_milp
  - id: greedy_nearest
  - id: cbba
  - id: replicator_cardinality
  - id: bnn_cardinality
  - id: smith_cardinality
  - id: replicator_cardinality_repair
  - id: logit_cardinality_repair
  - id: bnn_cardinality_repair
  - id: primal_dual_local_repair
  - id: tensor_quorum_flow_repair

seeds:
  start: 2400
  count: 20

hypotheses:
  - id: H_DIAG_SP1_repair_lower_gap_than_replicator
    class: PairedSuperiorityHypothesis
    metric: optimality_gap_vs_oracle
    treatment: replicator_cardinality_repair
    control: replicator_cardinality
    alternative: less
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]
  - id: H_DIAG_SP1_tensor_repair_lower_gap_than_cbba
    class: PairedSuperiorityHypothesis
    metric: optimality_gap_vs_oracle
    treatment: tensor_quorum_flow_repair
    control: cbba
    alternative: less
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]

artifacts:
  save_snapshots: false
  save_trajectory_plot: false
  save_video: false
