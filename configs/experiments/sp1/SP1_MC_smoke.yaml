experiment_id: SP1_MC_smoke
mode: monte_carlo
description: "Small SP1 Monte Carlo smoke across under, balanced, over, and random generators."
output_dir: results/sp1/SP1_MC_smoke

scenarios:
  - id: SP1_recruitment
    param_generator: under_demand
  - id: SP1_recruitment
    param_generator: balanced_demand
  - id: SP1_recruitment
    param_generator: over_demand
  - id: SP1_recruitment
    param_generator: monte_carlo

methods:
  - id: greedy_nearest
  - id: centralized_coalition_milp
  - id: primal_dual_cardinality_capacity
  - id: primal_dual_wrench_market
  - id: imitation_oracle
    params:
      checkpoint: outputs/trained_models/SP1/imitation_oracle/v1/model.json
  - id: mappo_recruitment
    params:
      checkpoint: outputs/trained_models/SP1/mappo_recruitment/v1/model.json

seeds:
  start: 2000
  count: 3

artifacts:
  save_plots: true
  save_video: true
  video:
    fps: 10
    duration_s: 24
    final_hold_s: 6
