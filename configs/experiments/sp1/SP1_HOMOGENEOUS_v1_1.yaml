experiment_id: SP1_HOMOGENEOUS_v1_1
description: >-
  Confirmatory unified homogeneous recruitment experiment. The q=1 condition
  subsumes the historical one-to-one SP0 baseline and q=2 represents homogeneous
  cooperative recruitment. Population dynamics and integer closure are reported
  separately. Fresh seeds follow the noncanonical numerical pilot v1.
output_dir: results/sp1/SP1_HOMOGENEOUS_v1_1
confirmatory: true
base_seed: 330000
replicates_per_cell: 25

factors:
  n_robots: [8, 16, 24]
  quorum: [1, 2]
  geometry: [uniform, clustered, crossed]
  graph: [complete, ring]

population:
  alpha: 5.0
  beta: 1.0
  dt: 0.01
  max_steps: 300
  tolerance: 0.02
  stable_steps: 6
  consensus_rounds: 4

methods:
  - smith_qr
  - replicator_qr
  - bnn_qr
  - uniform_qr
  - random_qr
  - greedy
  - auction_proxy
  - hungarian_exact
