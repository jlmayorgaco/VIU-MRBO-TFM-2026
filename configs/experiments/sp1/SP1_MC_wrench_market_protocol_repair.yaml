experiment_id: SP1_MC_wrench_market_protocol_repair
mode: monte_carlo
description: "Wrench-market-games inspired SP1 diagnostic: protocol engines, potential-guarded integer repair, and quality-resource separation."
output_dir: results/sp1/SP1_MC_wrench_market_protocol_repair

scenarios:
  - id: SP1_recruitment
    param_generator: under_demand
  - id: SP1_recruitment
    param_generator: balanced_demand
  - id: SP1_recruitment
    param_generator: over_demand
  - id: SP1_recruitment
    param_generator: monte_carlo

methods:
  - id: centralized_coalition_milp
  - id: greedy_nearest
  - id: cbba
  - id: replicator_cardinality
  - id: bnn_cardinality
  - id: smith_cardinality
  - id: replicator_cardinality_repair
  - id: logit_cardinality_repair
  - id: bnn_cardinality_repair
  - id: primal_dual_local_repair
  - id: tensor_quorum_flow_repair

seeds:
  start: 2400
  count: 60

hypotheses:
  - id: H_WMG_SP1_protocol_engines_differ_diagnostic
    class: MultiMethodFriedmanHypothesis
    metric: optimality_gap_vs_oracle
    methods:
      - replicator_cardinality
      - bnn_cardinality
      - smith_cardinality
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]

  - id: H_WMG_SP1_repair_lower_gap_than_replicator
    class: PairedSuperiorityHypothesis
    metric: optimality_gap_vs_oracle
    treatment: replicator_cardinality_repair
    control: replicator_cardinality
    alternative: less
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]

  - id: H_WMG_SP1_tensor_repair_lower_gap_than_cbba
    class: PairedSuperiorityHypothesis
    metric: optimality_gap_vs_oracle
    treatment: tensor_quorum_flow_repair
    control: cbba
    alternative: less
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]

  - id: H_WMG_SP1_repair_not_slower_than_mappo_scale_proxy
    class: NonInferiorityHypothesis
    metric: coalition_success_rate
    treatment: primal_dual_local_repair
    control: smith_cardinality
    ratio_threshold: 0.95
    alpha: 0.05
    paired_by: [scenario_generator, scenario_variant_id, seed]

artifacts:
  save_snapshots: true
  save_trajectory_plot: true
  save_video: true
  video:
    save_per_method: true
    save_all_runs: false
    fps: 10
    duration_s: 24
    final_hold_s: 6
