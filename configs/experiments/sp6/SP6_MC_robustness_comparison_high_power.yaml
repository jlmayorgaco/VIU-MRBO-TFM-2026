experiment_id: SP6_MC_robustness_comparison_high_power
mode: monte_carlo
description: "High-power SP6 operational robustness Monte Carlo. Preserves the eight canonical recovery scenarios and ten-method comparison; seed count gives exactly 20,000 rollouts."
output_dir: results/sp6/SP6_MC_robustness_comparison_high_power
seeds:
  start: 7200
  count: 250
scenarios:
  - param_generator: communication_radius_decay
  - param_generator: robot_dropout_mid_task
  - param_generator: battery_depletion_reallocation
  - param_generator: blocked_corridor_recovery
  - param_generator: infeasible_load_detection
  - param_generator: delayed_information_consensus
  - param_generator: multi_load_priority_shift
  - param_generator: monte_carlo
methods:
  - classic_centralized_replan
  - classic_decentralized_greedy_recovery
  - cbba_recovery
  - cbf_recovery
  - replicator_repair_recovery
  - smith_qr_recovery
  - primal_dual_recovery
  - tensor_flow_recovery
  - ours_guarded_wrench_market_recovery
  - reference_resilient_oracle
trajectory_sample_runs: 12
hypotheses:
  - id: H6.1_ours_reduces_lost_load_rate_vs_classic_greedy
    method_a: ours_guarded_wrench_market_recovery
    method_b: classic_decentralized_greedy_recovery
    metric: lost_load_rate
    direction: less
  - id: H6.2_ours_improves_completion_vs_smith_qr
    method_a: ours_guarded_wrench_market_recovery
    method_b: smith_qr_recovery
    metric: task_completion_rate
    direction: greater
  - id: H6.3_ours_reduces_reference_gap_vs_cbba
    method_a: ours_guarded_wrench_market_recovery
    method_b: cbba_recovery
    metric: performance_gap_vs_reference
    direction: less
  - id: H6.4_recovery_family_differs_on_reference_gap
    methods:
      - classic_decentralized_greedy_recovery
      - cbba_recovery
      - smith_qr_recovery
      - primal_dual_recovery
      - tensor_flow_recovery
      - ours_guarded_wrench_market_recovery
    metric: performance_gap_vs_reference
artifacts:
  save_video: false
