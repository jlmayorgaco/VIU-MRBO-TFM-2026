experiment_id: SP2_HETEROGENEOUS_GAME_v1_2
description: Final confirmatory factorial heterogeneous-capacity game experiment with solver-inclusive runtime.
output_dir: results/sp2/SP2_HETEROGENEOUS_GAME_v1_2
confirmatory: true
base_seed: 360000
replicates_per_cell: 5

factors:
  n_robots: [8, 16]
  n_loads: [3, 5]
  heterogeneity: [low, high]
  demand_ratio: [0.70, 1.00, 1.25]
  geometry: [uniform, clustered]
  graph: [complete, ring]

population:
  alpha: 4.0
  beta: 0.35
  epsilon: 0.20
  dt: 0.04
  max_steps: 300
  tolerance: 0.025
  stable_steps: 6
  consensus_rounds: 4

objective:
  partial_weight: 0.30
  distance_weight: 0.08

methods:
  - smith__plain_deficit
  - smith__marginal_deficit
  - smith__marginal_log
  - replicator__plain_deficit
  - replicator__marginal_deficit
  - replicator__marginal_log
  - erv_bnn__plain_deficit
  - erv_bnn__marginal_deficit
  - erv_bnn__marginal_log
  - uniform_closure
  - random_closure
  - greedy_capacity
  - auction_capacity
  - milp_exact
