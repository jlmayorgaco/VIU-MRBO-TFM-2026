experiment_id: SP5_DEBUG_smoke
mode: monte_carlo
output_dir: results/sp5/SP5_DEBUG_smoke

seeds:
  start: 6100
  count: 2

scenarios:
  - param_generator: formation_corridor_push
  - param_generator: cargo_overhead_delivery
  - param_generator: multi_group_crossing_push

methods:
  - id: classic_centralized_shortest_push
  - id: classic_decentralized_apf_push
  - id: sota_centralized_cbf_push
  - id: sota_decentralized_vo_push
  - id: sota_centralized_cbf_cargo
  - id: sota_decentralized_vo_cargo
  - id: ours_primal_dual_wrench_push
  - id: ours_tensor_game_push
  - id: ours_hamiltonian_cargo
  - id: reference_centralized_mpc_cbf_cargo

hypotheses:
  - id: H5_DEBUG_reference_gap
    metric: performance_gap_vs_reference
    method_a: reference_centralized_mpc_cbf_cargo
    method_b: classic_decentralized_apf_push
    direction: less
    alpha: 0.05
  - id: H5_DEBUG_ours_formation
    metric: formation_broken_rate
    method_a: ours_hamiltonian_cargo
    method_b: classic_decentralized_apf_push
    direction: less
    alpha: 0.05

trajectory_sample_runs: 5

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 44
    final_hold_s: 10
    max_per_scenario: 2
    selection_metric: score_value
