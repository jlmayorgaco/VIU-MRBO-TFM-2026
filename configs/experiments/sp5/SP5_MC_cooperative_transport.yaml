experiment_id: SP5_MC_cooperative_transport
mode: monte_carlo
output_dir: results/sp5/SP5_MC_cooperative_transport

seeds:
  start: 6100
  count: 50

scenarios:
  - param_generator: formation_corridor_push
  - param_generator: cargo_overhead_delivery
  - param_generator: multi_group_crossing_push
  - param_generator: overactuated_push_drag
  - param_generator: scarce_cargo_multi_load
  - param_generator: monte_carlo

methods:
  - id: classic_centralized_shortest_push
  - id: classic_decentralized_apf_push
  - id: sota_centralized_cbf_push
  - id: sota_decentralized_vo_push
  - id: sota_centralized_cbf_cargo
  - id: sota_decentralized_vo_cargo
  - id: ours_primal_dual_wrench_push
  - id: ours_tensor_game_push
  - id: ours_hamiltonian_cargo
  - id: reference_centralized_mpc_cbf_cargo

hypotheses:
  - id: H5_1_reference_reduces_gap_vs_classic_apf
    metric: performance_gap_vs_reference
    method_a: reference_centralized_mpc_cbf_cargo
    method_b: classic_decentralized_apf_push
    direction: less
    alpha: 0.05
  - id: H5_2_ours_hamiltonian_reduces_formation_break_vs_sota_vo_cargo
    metric: formation_broken_rate
    method_a: ours_hamiltonian_cargo
    method_b: sota_decentralized_vo_cargo
    direction: less
    alpha: 0.05
  - id: H5_3_ours_tensor_improves_target_reached_vs_classic_push
    metric: target_reached
    method_a: ours_tensor_game_push
    method_b: classic_decentralized_apf_push
    direction: greater
    alpha: 0.05
  - id: H5_4_methods_differ_transport_score
    metric: score_value
    methods:
      - classic_centralized_shortest_push
      - classic_decentralized_apf_push
      - sota_centralized_cbf_push
      - sota_decentralized_vo_push
      - sota_centralized_cbf_cargo
      - sota_decentralized_vo_cargo
      - ours_primal_dual_wrench_push
      - ours_tensor_game_push
      - ours_hamiltonian_cargo
    alpha: 0.05

trajectory_sample_runs: 20

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 44
    final_hold_s: 10
    max_per_scenario: 4
    selection_metric: score_value
