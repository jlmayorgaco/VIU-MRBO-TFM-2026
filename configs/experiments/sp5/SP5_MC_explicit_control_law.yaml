experiment_id: SP5_MC_explicit_control_law
mode: monte_carlo
output_dir: results/sp5/SP5_MC_explicit_control_law

seeds:
  start: 6650
  count: 12

scenarios:
  - param_generator: formation_corridor_push
  - param_generator: multi_group_crossing_push
  - param_generator: overactuated_push_drag
  - param_generator: monte_carlo

methods:
  - id: classic_decentralized_apf_push
  - id: sota_centralized_cbf_push
  - id: sota_decentralized_vo_push
  - id: sota_decentralized_vo_cargo
  - id: ours_tensor_game_push
  - id: ours_explicit_vgne_cbf_push
  - id: ours_explicit_vgne_cbf_cargo
  - id: ours_hamiltonian_cargo
  - id: reference_centralized_mpc_cbf_cargo

hypotheses:
  - id: H5E_1_explicit_cargo_improves_target_reached_vs_classic_apf
    metric: target_reached
    method_a: ours_explicit_vgne_cbf_cargo
    method_b: classic_decentralized_apf_push
    direction: greater
    alpha: 0.05
  - id: H5E_2_explicit_cargo_reduces_position_error_vs_sota_vo_cargo
    metric: final_position_error_m
    method_a: ours_explicit_vgne_cbf_cargo
    method_b: sota_decentralized_vo_cargo
    direction: less
    alpha: 0.05
  - id: H5E_3_explicit_push_reduces_wrench_residual_vs_tensor
    metric: mean_wrench_residual_norm
    method_a: ours_explicit_vgne_cbf_push
    method_b: ours_tensor_game_push
    direction: less
    alpha: 0.05
  - id: H5E_4_explicit_family_differs
    metric: score_value
    methods:
      - classic_decentralized_apf_push
      - sota_centralized_cbf_push
      - sota_decentralized_vo_push
      - sota_decentralized_vo_cargo
      - ours_tensor_game_push
      - ours_explicit_vgne_cbf_push
      - ours_explicit_vgne_cbf_cargo
      - ours_hamiltonian_cargo
    alpha: 0.05

trajectory_sample_runs: 12

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 30
    final_hold_s: 6
    max_per_scenario: 1
    selection_metric: score_value
