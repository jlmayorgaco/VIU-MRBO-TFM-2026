protocol_id: PHYSICAL_COALITION_CERTIFICATE_v1_1_FIXEDN
frozen_design:
  sampling: fixed_n
  worlds_per_family: 100
  unit: paired_world
  endpoint: final_physical_success
  estimand: paired_risk_difference_after_minus_before
  confidence_interval: paired_percentile_bootstrap_95
  bootstrap_samples: 4000
  test: exact_mcnemar_two_sided
  multiplicity: holm_across_all_20_contrasts
  alpha: 0.05
  decision_rule: >-
    Positive support requires CI95_low > 0 and Holm-adjusted p < 0.05;
    negative support requires CI95_high < 0 and Holm-adjusted p < 0.05;
    otherwise the contrast is inconclusive or null.
contrasts:
  - {id: HC-NOM-A0-A1, family: nominal_rotation, before: A0_RAW_PREF, after: A1_INTEGER_QR, bootstrap_seed: 121725}
