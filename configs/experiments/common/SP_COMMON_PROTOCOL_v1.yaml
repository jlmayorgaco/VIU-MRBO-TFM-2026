protocol_id: SP_COMMON_PROTOCOL_v1
schema_version: sp-common-v1
status: draft
canonical_format: parquet
inspection_export: csv

lifecycle:
  states:
    - DRAFT
    - DRY_RUN_PASSED
    - FROZEN
    - TRAINING_COMPLETE
    - TEST_SEEDS_OPENED
    - TEST_COMPLETE
    - POSTPROCESS_COMPLETE
    - ACCEPTED
    - PROMOTED
  append_only_events: true
  fail_closed: true

splits:
  required: [tuning, training, validation, confirmatory]
  mutually_disjoint: true
  worlds_paired_across_methods: true
  confirmatory_opening_requires: [DRY_RUN_PASSED, FROZEN, budget_preflight_passed]

stages:
  immutable: [RAW, REPAIR, QR]
  generic_success_column_forbidden: true
  required_prefixes: [raw_, repair_, qr_]

cache_key_fields:
  - protocol_version
  - trainer_version
  - policy_version
  - checkpoint_sha256
  - world_set_sha256
  - evaluation_config_sha256
  - decoder_version
  - repair_version
  - closure_version
  - raw_or_closed_mode

failure_taxonomy:
  - oracle_infeasible_world
  - method_nonconvergence
  - method_timeout
  - numerical_error
  - invalid_assignment
  - repair_failure
  - closure_failure
  - safety_violation
  - external_process_error
  - postprocessing_error
  - unknown_failure

schemas:
  - world_registry
  - run_results
  - method_manifest
  - checkpoint_manifest
  - trajectory_manifest
  - failure_registry
  - hypothesis_results
  - claims_evidence
  - artifact_manifest

statistics:
  reject_nonfinite_effect_or_interval: true
  exact_zero_p_forbidden: true
  multiplicity: Holm_within_preregistered_family
  fallback_required: true
  nonestimable_is_support: false
  precision_extension_only: true

required_gates:
  - G_SCHEMA
  - G_PRIMARY_KEYS
  - G_WORLD_PAIRING
  - G_SPLIT_ISOLATION
  - G_CHECKPOINT_LOAD
  - G_CHECKPOINT_SENSITIVITY
  - G_CACHE_ISOLATION
  - G_RAW_REPAIR_QR_SEPARATION
  - G_FAILURE_TAXONOMY
  - G_STATISTICAL_FINITE_RESULTS
  - G_REBUILD_FROM_RAW
  - G_BUDGET_PREFLIGHT
  - G_FINAL_ACCEPTANCE

required_artifacts:
  manifest:
    - protocol_frozen.yaml
    - run_manifest.json
    - environment_lock.json
    - hardware_by_stage.json
    - seed_registry.csv
    - world_registry.parquet
    - checkpoint_manifest.csv
    - artifact_hashes.sha256
    - deviations.md
    - final_acceptance.json
  raw:
    - worlds.parquet
    - runs.parquet
    - assignments_raw.parquet
    - assignments_repair.parquet
    - assignments_qr.parquet
    - failures.parquet
    - events.parquet
  tables:
    - hypothesis_results.csv
    - failure_breakdown.csv
    - closure_attribution.csv
    - claims_evidence.csv
  provenance:
    figure_source_data_required: true
    trajectory_manifest_required: true
    rebuild_command_required: true
