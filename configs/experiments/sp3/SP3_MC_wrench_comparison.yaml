experiment_id: SP3_MC_wrench_comparison
mode: monte_carlo
output_dir: results/sp3/SP3_MC_wrench_comparison

seeds:
  start: 4100
  count: 100

scenarios:
  - param_generator: point_load_degenerate
  - param_generator: bar_torque_pure
  - param_generator: one_sided_push
  - param_generator: off_center_com
  - param_generator: long_payload_slots
  - param_generator: slot_saturation

methods:
  - id: wrench_oracle
  - id: oracle_scalar_assignment
  - id: hungarian_slots
  - id: capacity_greedy_slots
  - id: cbba_slots
  - id: replicator_wrench_deficit
  - id: bnn_wrench_deficit
  - id: smith_wrench_deficit
  - id: smith_wrench_marginal
  - id: support_dual_wrench_market

hypotheses:
  - id: H3_1_scalar_false_positives_rotational_loads
    metric: false_positive_rate
    method: oracle_scalar_assignment
    threshold: 0.0
    direction: greater
    alpha: 0.05
  - id: H3_2_smith_wrench_lower_residual_than_smith_capacity
    metric: wrench_residual_norm
    method_a: smith_wrench_deficit
    method_b: capacity_greedy_slots
    direction: less
    alpha: 0.05
  - id: H3_3_capacity_greedy_more_false_positives_than_support_dual
    metric: false_positive_rate
    method_a: capacity_greedy_slots
    method_b: support_dual_wrench_market
    direction: greater
    alpha: 0.05
  - id: H3_4_support_dual_lower_gap_than_cbba
    metric: optimality_gap_vs_wrench_oracle
    method_a: support_dual_wrench_market
    method_b: cbba_slots
    direction: less
    alpha: 0.05
  - id: H3_5_methods_differ_wrench_gap
    metric: optimality_gap_vs_wrench_oracle
    methods:
      - hungarian_slots
      - capacity_greedy_slots
      - cbba_slots
      - replicator_wrench_deficit
      - bnn_wrench_deficit
      - smith_wrench_deficit
      - smith_wrench_marginal
      - support_dual_wrench_market
    alpha: 0.05

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 28
    final_hold_s: 8
    max_per_scenario: 8
    selection_metric: wrench_feasible_rate
