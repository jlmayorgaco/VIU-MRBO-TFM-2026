experiment_id: SP3_WRENCH_NASH_GAME_v1
output_dir: results/sp3/SP3_WRENCH_NASH_GAME_v1
confirmatory: false
superseded_by: SP3_WRENCH_NASH_GAME_v1_1
superseded_reason: "Frozen KKT/QP audit failed; v1.1 changes only the projected primal-dual horizon."
audit_worlds: 60

seeds:
  start: 460000
  count: 100

scenarios:
  - param_generator: point_load_degenerate
  - param_generator: bar_torque_pure
  - param_generator: one_sided_push
  - param_generator: off_center_com
  - param_generator: long_payload_slots
  - param_generator: slot_saturation

game:
  steps: 500
  dt: 0.07
  dual_dt: 0.08
  regularization: 0.025
  tolerance: 0.0002
  consensus_rounds: 4

methods:
  - id: wrench_oracle
    kind: allocator
  - id: oracle_scalar_assignment
    kind: allocator
  - id: cbba_slots
    kind: allocator
  - id: wrench_greedy
    kind: allocator
  - id: smith_wrench_pairs_guarded
    kind: allocator
  - id: uniform_guarded
    kind: uniform
    guarded: true
  - id: nash_pd_exact_unguarded
    kind: game
    protocol: projected_pd
    graph: complete
    guarded: false
  - id: nash_pd_exact_guarded
    kind: game
    protocol: projected_pd
    graph: complete
    guarded: true
  - id: nash_pd_ring_guarded
    kind: game
    protocol: projected_pd
    graph: ring
    consensus_rounds: 4
    guarded: true
  - id: smith_price_guarded
    kind: game
    protocol: smith
    graph: complete
    guarded: true
  - id: replicator_price_guarded
    kind: game
    protocol: replicator
    graph: complete
    guarded: true
  - id: erv_bnn_price_guarded
    kind: game
    protocol: erv_bnn
    graph: complete
    guarded: true

hypotheses:
  - id: H-SP3-1-guard-reduces-fp
    metric: fp_given_assigned
    method_a: nash_pd_exact_guarded
    method_b: nash_pd_exact_unguarded
    direction: less
  - id: H-SP3-2-vector-beats-scalar-gap
    metric: optimality_gap_vs_wrench_oracle
    method_a: nash_pd_exact_guarded
    method_b: oracle_scalar_assignment
    direction: less
  - id: H-SP3-3-pair-beats-cbba-gap
    metric: optimality_gap_vs_wrench_oracle
    method_a: smith_wrench_pairs_guarded
    method_b: cbba_slots
    direction: less
  - id: H-SP3-4-exact-beats-ring-kkt
    metric: kkt_residual
    method_a: nash_pd_exact_guarded
    method_b: nash_pd_ring_guarded
    direction: less
