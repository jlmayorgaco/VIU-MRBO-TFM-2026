experiment_id: SP3_POSE_suite_euler_lagrange_transport
mode: pose_transport_suite
output_dir: results/sp3/SP3_POSE_suite_euler_lagrange_transport

methods:
  - id: wrench_oracle
  - id: hungarian_slots
  - id: capacity_greedy_slots
  - id: cbba_slots
  - id: smith_wrench_deficit
  - id: support_dual_wrench_market

pose_transport:
  load_index: 0
  complete_uncovered_slots: true
  recruit_fraction: 0.24
  dynamics:
    dt: 0.04
    steps: 180
    kp_pos: 24.0
    kd_pos: 38.0
    kp_theta: 24.0
    kd_theta: 68.0
    linear_damping: 16.0
    angular_damping: 82.0
    force_command_limit_n: 105.0
    torque_command_limit_nm: 58.0

success_thresholds:
  position_error_m: 1.0
  orientation_error_deg: 20.0
  slot_coverage_ratio: 0.50

cases:
  - id: overactuated_push_more_robots_than_loads
    param_generator: pose_push_overactuated
    seed: 5300
    movement_type: push
    robot_load_regime: more_robots_than_loads
    pose_transport:
      initial_theta_deg: -18.0
      target_pose:
        x: 2.20
        y: 0.70
        theta_deg: 8.0

  - id: balanced_push_drag_equal_robots_loads
    param_generator: pose_push_drag_balanced
    seed: 5301
    movement_type: push_drag
    robot_load_regime: equal_robots_loads
    pose_transport:
      initial_theta_deg: 18.0
      target_pose:
        x: -1.85
        y: 1.40
        theta_deg: -22.0

  - id: scarce_heavy_cargo_fewer_robots_than_loads
    param_generator: pose_cargo_scarce
    seed: 5302
    movement_type: cargo_push_drag
    robot_load_regime: fewer_robots_than_loads
    pose_transport:
      initial_theta_deg: -34.0
      target_pose:
        x: 0.25
        y: -3.95
        theta_deg: 40.0

artifacts:
  save_video: true
  fps: 8
  duration_s: 30
  final_hold_s: 8
  frame_stride: 4
