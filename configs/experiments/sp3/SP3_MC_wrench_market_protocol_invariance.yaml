experiment_id: SP3_MC_wrench_market_protocol_invariance
mode: monte_carlo
description: "Wrench-market-games inspired SP3 diagnostic: scalar insufficiency, complementarity, continuous wrench signal, guarded repair, and protocol-engine invariance."
output_dir: results/sp3/SP3_MC_wrench_market_protocol_invariance

seeds:
  start: 4400
  count: 100

scenarios:
  - param_generator: point_load_degenerate
  - param_generator: bar_torque_pure
  - param_generator: one_sided_push
  - param_generator: off_center_com
  - param_generator: long_payload_slots
  - param_generator: slot_saturation

methods:
  - id: wrench_oracle
  - id: oracle_scalar_assignment
  - id: hungarian_slots
  - id: capacity_greedy_slots
  - id: cbba_slots
  - id: replicator_wrench_deficit
  - id: bnn_wrench_deficit
  - id: smith_wrench_deficit
  - id: smith_wrench_marginal
  - id: smith_wrench_marginal_guarded
  - id: support_dual_wrench_market
  - id: support_dual_wrench_market_guarded
  - id: smith_wrench_pairs_guarded

hypotheses:
  - id: H_WMG_SP3_scalar_false_positive_positive
    metric: false_positive_rate
    method: oracle_scalar_assignment
    threshold: 0.0
    direction: greater
    alpha: 0.05

  - id: H_WMG_SP3_wrench_signal_lower_gap_than_scalar
    metric: optimality_gap_vs_wrench_oracle
    method_a: smith_wrench_deficit
    method_b: capacity_greedy_slots
    direction: less
    alpha: 0.05

  - id: H_WMG_SP3_engine_invariance_diagnostic
    metric: optimality_gap_vs_wrench_oracle
    methods:
      - replicator_wrench_deficit
      - bnn_wrench_deficit
      - smith_wrench_deficit
    alpha: 0.05

  - id: H_WMG_SP3_support_dual_lower_gap_than_cbba
    metric: optimality_gap_vs_wrench_oracle
    method_a: support_dual_wrench_market
    method_b: cbba_slots
    direction: less
    alpha: 0.05

  - id: H_WMG_SP3_guarded_fp_not_worse_than_marginal
    metric: fp_given_assigned
    method_a: smith_wrench_marginal_guarded
    method_b: smith_wrench_marginal
    direction: less
    alpha: 0.05

  - id: H_WMG_SP3_pair_repair_lower_gap_than_marginal
    metric: optimality_gap_vs_wrench_oracle
    method_a: smith_wrench_pairs_guarded
    method_b: smith_wrench_marginal
    direction: less
    alpha: 0.05

artifacts:
  save_video: true
  video:
    fps: 10
    duration_s: 28
    final_hold_s: 8
    max_per_scenario: 5
    selection_metric: feasible_coverage
