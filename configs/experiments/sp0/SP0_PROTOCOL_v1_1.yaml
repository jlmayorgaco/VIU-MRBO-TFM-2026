sp_id: SP0-v1.1
experiment_id: SP0_PROTOCOL_v1_1
mode: protocol
status: prepared_for_pre_registration_v1_1
frozen: false
output_dir: results/sp0/SP0_PROTOCOL_v1_1
expected_full_campaign_evaluations: 15436
scope:
  robots: homogeneous
  loads: homogeneous
  assignment: one_robot_per_load
  out_of_scope:
    - CoppeliaSim
    - multibody_dynamics
    - friction
    - rigid_contact
    - real_perception
    - physical_actuation
    - hardware_validation
implementation_decisions:
  exp4_population_finalists: 5
  exp4_population_finalist_rule: validation_top5_among_REP_SMI_BNN_LOG_PROJ_HYB_local_variants
  exp4_method_count: 10
  exp4_method_count_formula: GRD_DA_plus_5_population_plus_3_data_driven
  data_driven_candidates: [IPPO-GNN, MAPPO-GNN]
  data_driven_champion_rule: validation_between_IPPO_GNN_and_MAPPO_GNN
  data_driven_final_seeds: 3
  data_driven_failed_seed_rule: keep_report_do_not_replace
campaign_counts:
  B0: 300
  B2: 2400
  B3: 1536
  B4: 5760
  B5: 4000
  B6: 960
  B7: 480
auxiliary_preconfirmatory_counts:
  model_selection_validation: 96
  included_in_base_15436: false
  reason: select_B5_top5_and_B7_top3_without_using_confirmatory_results
pipeline:
  B0:
    mode: unit_benchmark
    gate_tolerance_phi: 1.0e-8
    config: configs/experiments/sp0/SP0_B0_unit_benchmark.yaml
  B2:
    dynamics: [REP, SMI, BNN, LOG, PROJ, IBR, GPC, HYB]
    fitness: [LIN, QUAD, ASYM, SIG, MC]
    closures: [RAW, QR1]
    regimes: [1.5, 1.0, 0.67]
    sizes: [8, 32]
    seeds: 5
    timeout_resolution:
      threshold: 0.20
      action: mark_NONCONVERGENT_CLOSURE_ONLY
      continuous_claims_allowed: false
      closure_evaluation_allowed_if_no_fatal_gate: true
  B3:
    method_families: 8
    rounds:
      - configs: 12
        worlds: 6
      - configs: 4
        worlds: 15
      - configs: 2
        worlds: 30
    score: mean_NR_plus_fail_penalty_plus_0_25_CVaR95_NR
  B4:
    units: 12
    sizes: [8, 16, 32, 64]
    regimes: [1.5, 1.0, 0.67]
    worlds_per_cell: 40
  B5:
    regime: balanced
    sizes: [32, 64]
    mean_degrees: [2, 4, 6, 10, N_minus_1]
    methods: 10
    worlds_per_cell: 40
  B6:
    stress_types: [G-TIE, G-X, G-CLU, G-BIAS_G-ZERO]
    units: 12
    worlds_per_type: 20
  B7:
    sizes: [24, 48]
    regime: balanced
    methods: 6
    worlds_per_cell: 40
hyperparameters:
  fitness:
    alpha: [0.25, 0.5, 1, 2]
    lambda: [0.5, 1, 2, 4]
    r: [0.5, 1, 2]
    beta: [1, 2, 5, 10]
    delta_x: [0.01, 0.05, 0.1]
  dynamics:
    h: [0.01, 0.03, 0.05, 0.1]
    eta: [0.05, 0.1, 0.2, 0.5]
    q: [1, 1.5, 2]
    kappa: [0.5, 1, 2]
    alpha_BR: [0.1, 0.3, 0.5]
    dwell_time_s: [0, 0.2, 0.5, 1]
  consensus:
    gain: [0.1, 0.3, 0.5, 1]
    degree_normalization: [true, false]
    retention: [0, 0.5, 0.9]
  qr:
    delta_QR: [1.0e-4, 1.0e-3, 1.0e-2]
    hysteresis: [0, 0.01, 0.05]
    max_swaps: [1, 5, 10]
    qra_depth: [2, 4, complete]
  data_driven:
    learning_rate: [1.0e-4, 3.0e-4, 1.0e-3]
    hidden_dimension: [64, 128]
    gnn_layers: [2, 3]
    ppo_clip: [0.1, 0.2]
    entropy_coefficient: [0.001, 0.01]
    discount_factor: [0.95, 0.99]
metrics_primary:
  - success
  - normalized_regret
  - time_to_useful_solution
  - messages_to_useful_solution
  - bytes_to_useful_solution
claims_allowed:
  - statistical_superiority_in_preregistered_metrics
  - non_inferiority_with_margin
  - pareto_tradeoff
  - observed_robustness
  - observed_scalability
  - empirical_convergence
  - approximate_equilibrium
  - observed_poa
  - observed_price_of_locality_or_decentralization
claims_forbidden_without_proof:
  - universal_stability
  - global_optimality_of_QR1
  - convergence_under_any_graph
  - theoretical_bounded_poa
  - direct_transfer_to_physical_robots
  - industrial_safety
  - validity_under_real_contact_or_dynamics
convergence:
  integration_dt_s: 0.1
  T_max_s: 10.0
  max_steps: 100
  stable_window_s: 1.0
  stable_window_steps: 10
  state_change_tolerance: 1.0e-4
  equilibrium_residual_tolerance: 1.0e-3
  useful_solution_NR_epsilon: 0.05

data_driven_training:
  step_unit: joint_environment_transition
  algorithms: [IPPO-GNN, MAPPO-GNN]
  DD_1:
    configurations_per_algorithm: 6
    train_seeds_per_configuration: 1
    environment_steps: 250000
  DD_2:
    retained_configurations_per_algorithm: 2
    train_seeds_per_configuration: 2
    environment_steps: 1000000
  final:
    independent_train_seeds: 3
    environment_steps_per_seed: 5000000
    checkpoint_rule: exact_final_checkpoint_no_best_seed_selection
  validation_success_threshold: 0.99
  greedy_noninferiority_delta: 0.05
  required_consecutive_evaluations: 3
  maximum_posterior_collapse: 0.05
  cpu_rule: retain_full_step_budget_or_report_HARDWARE_BLOCKED
  hardware_preflight:
    benchmark_environment_steps: 10000
    benchmark_seed: 777001
    maximum_estimated_training_wall_hours: 24
    benchmark_scope: prefreeze_engineering_only
    long_cpu_override_required: true
  actor_information: graph_local_only
  MAPPO_critic_information: global_training_only
  reward_oracle_access: forbidden

hypotheses:
  - {id: H0-SP0-P1, family: P, status: confirmatory, outcome: final_success, test: mixed_logistic_and_paired_McNemar}
  - {id: H0-SP0-P2, family: P, status: confirmatory, outcome: normalized_regret, test: robust_mixed_and_paired_BCa}
  - {id: H0-SP0-P3, family: P, status: confirmatory, outcome: time_to_useful_solution, test: survival_AFT_or_Cox_frailty}
  - {id: H0-SP0-P4, family: P, status: confirmatory, outcome: communication_to_useful_solution, test: paired_log_ratio_and_mixed_negative_binomial}
  - {id: H0-SP0-P5, family: P, status: confirmatory, outcome: method_by_regime_interaction, test: mixed_model}
  - {id: H0-SP0-P6, family: P, status: confirmatory, outcome: method_by_logN_interaction, test: mixed_model}
  - {id: H0-SP0-G1, family: G, status: exploratory_preregistered_B2_only, outcome: population_dynamic, test: preregistered_omnibus_and_planned_contrasts}
  - {id: H0-SP0-G2, family: G, status: exploratory_preregistered_B2_only, outcome: fitness, test: preregistered_omnibus}
  - {id: H0-SP0-G3, family: G, status: exploratory_preregistered_B2_only, outcome: dynamic_by_fitness_interaction, test: mixed_model}
  - {id: H0-SP0-G4, family: G, status: exploratory_preregistered_B2_only, outcome: final_success_RAW_vs_QR, test: paired_model}
  - {id: H0-SP0-G5, family: G, status: exploratory_preregistered_B2_only, outcome: normalized_regret_RAW_vs_QR, test: paired_BCa}
  - {id: H0-SP0-G6, family: G, status: exploratory_preregistered_B2_only, outcome: closure_neighborhood_QR1_QR2_QRA, test: planned_paired_contrasts}
  - {id: H0-SP0-C1, family: C, status: confirmatory, outcome: local_minus_global_NR, test: noninferiority, margin: 0.05}
  - {id: H0-SP0-C2, family: C, status: confirmatory, outcome: method_by_lambda2_interaction, test: mixed_model}
  - {id: H0-SP0-C3, family: C, status: confirmatory, outcome: method_by_occupancy_error_interaction, test: mixed_model}
  - {id: H0-SP0-R1, family: R, status: confirmatory, outcome: CVaR95_normalized_regret, test: paired_bootstrap}
  - {id: H0-SP0-R2, family: R, status: confirmatory, outcome: generalization_gap, test: paired_BCa}
  - {id: H0-SP0-R3, family: R, status: confirmatory, outcome: method_by_initialization_interaction, test: mixed_model}
  - {id: H0-SP0-R4, family: R, status: confirmatory, outcome: dynamic_by_initial_support_interaction, test: mixed_model}

multiplicity:
  correction: Holm
  scope: within_confirmatory_family
  apply_once_at_final_precision_sample_size: true

precision_extension:
  checkpoints: [40, 60, 100]
  normalized_regret_CI_width_max: 0.05
  success_difference_CI_width_max: 0.03
  trigger: precision_only
