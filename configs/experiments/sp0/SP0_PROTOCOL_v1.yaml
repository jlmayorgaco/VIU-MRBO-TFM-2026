sp_id: SP0-v1.0
experiment_id: SP0_PROTOCOL_v1
mode: protocol
status: prepared_for_pre_registration
frozen: false
output_dir: results/sp0/SP0_PROTOCOL_v1
expected_full_campaign_evaluations: 15436
scope:
  robots: homogeneous
  loads: homogeneous
  assignment: one_robot_per_load
  out_of_scope:
    - CoppeliaSim
    - multibody_dynamics
    - friction
    - rigid_contact
    - real_perception
    - physical_actuation
    - hardware_validation
implementation_decisions:
  exp4_population_finalists: 5
  exp4_population_finalist_rule: validation_top5_among_REP_SMI_BNN_LOG_PROJ_HYB_local_variants
  exp4_method_count: 10
  exp4_method_count_formula: GRD_DA_plus_5_population_plus_3_data_driven
  data_driven_candidates: [IPPO-GNN, MAPPO-GNN]
  data_driven_champion_rule: validation_between_IPPO_GNN_and_MAPPO_GNN
  data_driven_final_seeds: 3
  data_driven_failed_seed_rule: keep_report_do_not_replace
campaign_counts:
  B0: 300
  B2: 2400
  B3: 1536
  B4: 5760
  B5: 4000
  B6: 960
  B7: 480
pipeline:
  B0:
    mode: unit_benchmark
    gate_tolerance_phi: 1.0e-8
    config: configs/experiments/sp0/SP0_B0_unit_benchmark.yaml
  B2:
    dynamics: [REP, SMI, BNN, LOG, PROJ, IBR, GPC, HYB]
    fitness: [LIN, QUAD, ASYM, SIG, MC]
    closures: [RAW, QR1]
    regimes: [1.5, 1.0, 0.67]
    sizes: [8, 32]
    seeds: 5
  B3:
    method_families: 8
    rounds:
      - configs: 12
        worlds: 6
      - configs: 4
        worlds: 15
      - configs: 2
        worlds: 30
    score: mean_NR_plus_fail_penalty_plus_0_25_CVaR95_NR
  B4:
    units: 12
    sizes: [8, 16, 32, 64]
    regimes: [1.5, 1.0, 0.67]
    worlds_per_cell: 40
  B5:
    regime: balanced
    sizes: [32, 64]
    mean_degrees: [2, 4, 6, 10, N_minus_1]
    methods: 10
    worlds_per_cell: 40
  B6:
    stress_types: [G-TIE, G-X, G-CLU, G-BIAS_G-ZERO]
    units: 12
    worlds_per_type: 20
  B7:
    sizes: [24, 48]
    regime: balanced
    methods: 6
    worlds_per_cell: 40
hyperparameters:
  fitness:
    alpha: [0.25, 0.5, 1, 2]
    lambda: [0.5, 1, 2, 4]
    r: [0.5, 1, 2]
    beta: [1, 2, 5, 10]
    delta_x: [0.01, 0.05, 0.1]
  dynamics:
    h: [0.01, 0.03, 0.05, 0.1]
    eta: [0.05, 0.1, 0.2, 0.5]
    q: [1, 1.5, 2]
    kappa: [0.5, 1, 2]
    alpha_BR: [0.1, 0.3, 0.5]
    dwell_time_s: [0, 0.2, 0.5, 1]
  consensus:
    gain: [0.1, 0.3, 0.5, 1]
    degree_normalization: [true, false]
    retention: [0, 0.5, 0.9]
  qr:
    delta_QR: [1.0e-4, 1.0e-3, 1.0e-2]
    hysteresis: [0, 0.01, 0.05]
    max_swaps: [1, 5, 10]
    qra_depth: [2, 4, complete]
  data_driven:
    learning_rate: [1.0e-4, 3.0e-4, 1.0e-3]
    hidden_dimension: [64, 128]
    gnn_layers: [2, 3]
    ppo_clip: [0.1, 0.2]
    entropy_coefficient: [0.001, 0.01]
    discount_factor: [0.95, 0.99]
metrics_primary:
  - success
  - normalized_regret
  - time_to_useful_solution
  - messages_to_useful_solution
  - bytes_to_useful_solution
claims_allowed:
  - statistical_superiority_in_preregistered_metrics
  - non_inferiority_with_margin
  - pareto_tradeoff
  - observed_robustness
  - observed_scalability
  - empirical_convergence
  - approximate_equilibrium
  - observed_poa
  - observed_price_of_locality_or_decentralization
claims_forbidden_without_proof:
  - universal_stability
  - global_optimality_of_QR1
  - convergence_under_any_graph
  - theoretical_bounded_poa
  - direct_transfer_to_physical_robots
  - industrial_safety
  - validity_under_real_contact_or_dynamics
