name: marl_proxy_policy
description: >
  Baseline MARL reproducible sin dependencias pesadas. Representa una politica
  parameter-sharing con observacion local y ejecucion descentralizada. No se
  presenta como contribucion teorica ni como PPO/MAPPO entrenado.
observation:
  robot:
    - own_position_xy
    - own_heading
    - active_assignment
    - active_or_failed
  local_neighbors:
    - relative_position_xy
    - communication_visible
    - current_assignment
  known_loads:
    - relative_source_xy
    - relative_target_xy
    - weight
    - reward
    - price
    - age_since_spawn
    - status
    - local_quorum_deficit
    - descriptor_visible
  channel:
    - r_com
    - packet_loss
    - local_degree
policy:
  type: deterministic_parameter_sharing_proxy
  implementation: src/viu_mrob_tfm/simulations/warehouse.py::POLICY_MARL_PROXY
  action: assign_to_idle_or_known_load
  execution: decentralized
  training: none
  ctde_note: >
    El wrapper deja especificada la observacion que usaria PPO/MAPPO-lite. La
    version actual usa una politica compartida cerrada para tener baseline
    reproducible sin introducir ruido de entrenamiento.
reward:
  delivered_reward: 1.0
  quorum_deficit_penalty: -0.55
  distance_penalty: -0.22
  age_bonus: 0.018
  stickiness_bonus: 0.35
evaluation:
  seeds: 20
  holdout_seeds: 20
  scenarios:
    - comm_degradation:R12_p0
    - comm_degradation:R4_p0
    - comm_degradation:R3_p0
    - scarcity_priority:default
    - robot_failures:default
outputs:
  root: results/marl_validation
  files:
    - runs.csv
    - summary.csv
    - paired_deltas.csv
    - README.md
