training_id: SP1_mappo_recruitment_v1
mode: train_mappo
description: "Train a real MAPPO recruitment baseline with decentralized actor and centralized critic."

scenarios:
  - id: SP1_recruitment
    param_generator: monte_carlo

train_seeds:
  start: 0
  count: 1000

validation_seeds:
  start: 1000
  count: 200

algorithm:
  id: recruitment.data_driven.decentralized.mappo_recruitment
  params:
    total_episodes: 512
    rollout_horizon: 32
    ppo_epochs: 4
    hidden_dim: 32
    learning_rate: 0.0005
    clip_epsilon: 0.2
    entropy_coef: 0.005
    value_coef: 0.5
    bc_pretrain_epochs: 40
    bc_learning_rate: 0.001
    use_quorum_decoder: true
    decoder_reward_weight: 2.0
    decoder_distance_weight: 0.02
    decoder_capacity_weight: 0.02
    decoder_actor_weight: 0.05
    decoder_demand_weight: 0.8
    random_seed: 1234

reward:
  success_weight: 10.0
  demand_weight: 4.0
  underassigned_penalty: 5.0
  overassigned_penalty: 2.0
  distance_penalty: 0.15
  communication_penalty: 0.01

output:
  checkpoint_dir: outputs/trained_models/SP1/mappo_recruitment/v1
