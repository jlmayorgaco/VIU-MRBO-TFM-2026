# arXiv query set for the TFM literature-review PDF corpus.
#
# Each topic is intentionally broad but still anchored to robotics, multi-agent
# systems, control, graph/network theory, game theory, geometry, or topology.
# The CLI can override max_results with --max-results-per-topic.

topics:
  - name: multi_agent_mobile_robotics
    max_results: 250
    query: '(all:"multi-agent" OR all:"multi agent" OR all:"multi-robot" OR all:"multi robot" OR all:"multi-AMR" OR all:"multi AMR") AND (all:"mobile robot" OR all:"mobile robotics" OR all:robotics OR all:AMR OR cat:cs.RO)'

  - name: distributed_multi_robot_control
    max_results: 250
    query: '(all:"distributed control" OR all:"decentralized control" OR all:consensus OR all:"cooperative control") AND (all:"multi-robot" OR all:"multi robot" OR all:"multi-agent" OR all:"multi agent" OR all:swarm) AND (cat:cs.RO OR cat:cs.SY OR cat:eess.SY OR cat:math.OC)'

  - name: networked_control_systems
    max_results: 250
    query: '(all:"networked control" OR all:"networked systems" OR all:"cyber-physical systems" OR all:"communication constraints" OR all:"event-triggered control") AND (cat:cs.SY OR cat:eess.SY OR cat:math.OC OR cat:cs.RO)'

  - name: graph_theory_consensus_networks
    max_results: 250
    query: '(all:"graph theory" OR all:Laplacian OR all:"algebraic connectivity" OR all:"spectral graph" OR all:"directed graph" OR all:"switching topology") AND (all:consensus OR all:"multi-agent" OR all:"multi robot" OR all:"networked system" OR all:formation)'

  - name: game_theory_multi_agent_math
    max_results: 250
    query: '(all:"game theory" OR all:"potential game" OR all:"evolutionary game" OR all:"mean field game" OR all:"differential game" OR all:"mechanism design" OR all:auction) AND (all:"multi-agent" OR all:distributed OR all:networked OR all:robot OR cat:cs.GT OR cat:econ.TH OR cat:math.OC)'

  - name: coalition_task_allocation
    max_results: 250
    query: '(all:coalition OR all:"coalition formation" OR all:"task allocation" OR all:"market-based" OR all:auction OR all:"contract net") AND (all:"multi-robot" OR all:"multi robot" OR all:"multi-agent" OR all:"multi agent" OR all:robotics)'

  - name: rigid_formation_geometry
    max_results: 250
    query: '(all:"rigid formation" OR all:"formation rigidity" OR all:"bearing rigidity" OR all:"distance rigidity" OR all:"formation control") AND (all:geometry OR all:geometric OR all:graph OR all:"multi-agent" OR all:"multi robot" OR cat:cs.RO OR cat:math.OC)'

  - name: cooperative_multi_robot_transportation
    max_results: 250
    query: '(all:"cooperative transportation" OR all:"cooperative transport" OR all:"object transport" OR all:"payload transport" OR all:"cooperative manipulation" OR all:"multi-robot manipulation") AND (all:"multi-robot" OR all:"multi robot" OR all:robot OR all:mobile OR cat:cs.RO)'

  - name: multi_robot_load_transport_amr_warehouse
    max_results: 250
