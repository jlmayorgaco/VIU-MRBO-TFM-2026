objective:
  definition: minimum connected coalition order with a strict lexicographic improvement
  audited_state: terminal assignment of Geo-QPG-BR initialized from idle
  max_order: 3
  connected_only: true
  truncated_label: '>3'
main:
  source_worlds: scripts/results/sp1_levels/n4_v1/raw/e3_confirmatory_worlds.csv
  source_runs: scripts/results/sp1_levels/n4_v2/raw/e4_family_runs.csv
  q_bar_kg: 5.0
  workspace_m:
  - 100.0
  - 100.0
  demand_split_alpha: 3.0
  graph_regime: medium
  expected_worlds: 1200
ratio_sweep:
  base_seed: 2026081517
  robot_load_pairs:
  - - 8
    - 4
  - - 12
    - 4
  - - 16
    - 4
  q_bar_kg: 5.0
  workspace_m:
  - 100.0
  - 100.0
  demand_split_alpha: 3.0
  graph_regime: medium
  scenarios:
  - uniform
  - clustered
  - separated
  - ring
  - corridor
  capacity_cv:
  - 0.0
  - 0.35
  - 0.65
  - 1.0
  pressure:
  - 0.7
  - 0.85
  seeds_per_cell: 10
analysis:
  independent_unit: world_seed
  confidence_level: 0.95
  interval: Wilson_for_category_proportions
  categories:
  - '2'
  - '3'
  - '>3'
  main_factors:
  - capacity_cv
  - pressure
  - scenario
  ratio_factors:
  - robots_per_load
  - capacity_cv
  - pressure
  - scenario
hypothesis:
  question: Which minimum connected coordination order is required to escape a unilateral
    Geo-QPG local minimum?
  audit_null: h_star_equals_1_after_unilateral_termination
  interpretation: descriptive barrier characterization; not a global complexity theorem
limitations:
- The state is the BR terminal reached from the idle profile, not an arbitrary assignment.
- The search is exact only within connected coalitions of size at most three.
- The category >3 does not distinguish a higher-order improvement from a global local
  optimum.
- The N/K sweep is an independent sensitivity block and is not pooled with the frozen
  confirmatory campaign.
- Network loss and delay are outside this campaign because DMIS+TX currently assumes
  reliable delivery.
