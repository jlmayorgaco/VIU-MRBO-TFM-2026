hypotheses:
  RQ_D:
    question: Does the continuous ranking of F-II survive the common atomic closure?
    null: continuous and post-closure winners coincide in every paired world
  RQ_E:
    question: Do distributed dual prices improve post-closure realizability at high
      pressure?
    contrast: distributed_pd_vgne_R minus fii_smith_R
    high_pressure: 0.85
  RQ_F:
    question: What quality-communication-computation frontier is observed across F-I
      to F-III?
  RQ_G:
    question: Does future-event information improve over myopic static re-solving?
    comparison: perfect_foresight_dp versus myopic_cold and event_triggered_warm
limitations:
- F-II uses dynamic average consensus on a static connected N3 graph.
- F-III convergence is accepted only when primal, dual, complementarity, stationarity
  and consensus residuals jointly pass.
- The common atomic closure is a bounded deterministic heuristic, not an exact integer
  solver.
- F-IV is a repeated potential-game pilot with exogenous events, not a claimed Markov
  potential game.
- The dynamic oracle is central, finite-horizon and restricted to small state spaces.
