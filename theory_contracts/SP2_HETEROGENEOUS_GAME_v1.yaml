contract_id: SP2_HETEROGENEOUS_GAME_v1
scope:
  robots: heterogeneous_scalar_effective_capacity
  loads: heterogeneous_scalar_demand
  strategies: loads_plus_idle
  graphs: [complete, fixed_ring]
  excluded: [vector_wrench, contact_geometry, time_varying_graph, physical_transport]
complexity:
  integer_problem: strongly_NP_hard_by_3_partition
  one_revision_step: "O(NK + |E|K)"
potential_family:
  expression: "Phi(x)=alpha sum_k w_k U_k(s_k)-beta sum_ik c_ik x_ik"
  aggregate: "s_k=sum_i e_ik x_ik"
  exact_fitness: "f_ik=alpha w_k e_ik U'_k(s_k)-beta c_ik"
claims:
  - Marginal-deficit and marginal-log fitness are exact gradients of concave potentials.
  - Smith, replicator, and BNN/ERV conserve every robot simplex.
  - Exact-information dynamics do not decrease the aligned potential in continuous time.
  - Plain deficit fitness is not generally potential-aligned when e_ik is pair-dependent.
nonclaims:
  - integer_global_optimality_of_population_dynamics
  - distributed_optimality_of_capacity_closure
  - guarantees_under_finite_consensus
  - vector_force_or_torque_feasibility
