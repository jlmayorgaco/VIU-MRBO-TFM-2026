experiment_id: SP4_DOCKING_GAME_CONFIRMATORY_v3
canonical_config: configs/experiments/sp4/SP4_DOCKING_GAME_CONFIRMATORY_v3.yaml

constructs:
  docking:
    definition: "Position <= 0.18 m, orientation <= 0.24 rad and speed <= 0.16 m/s are satisfied simultaneously; docking latches without teleportation."
  safe_success:
    definition: "All assigned robots dock before 35 s and no swept robot-robot, robot-obstacle, robot-load or boundary collision occurs."
  continuous_game:
    definition: "Simplex shares over two clockwise arcs, a locally shortest route, two counter-clockwise arcs and wait/alignment."
  route_memory:
    definition: "The selected homotopy side is held while the payload blocks the direct chord; this is local receding memory, not a global path certificate."
  closure:
    definition: "Wrench-priority greedy selection reserves space-time resources globally; RAW remains an explicit ablation."
  execution:
    definition: "RAW primitive, SAFE barrier-projected hand velocity and EXEC torque-saturated dynamic-unicycle motion are logged separately."
  safety:
    definition: "Alternating projection onto CBF half-spaces with footprint inflation and reachable acceleration bounds; it is not a monolithic QP solver."

claims:
  - id: T-SP4-1
    statement: "Symmetric space-time occupancy costs define an exact potential for the continuous primitive game."
    scope: "Each frozen receding snapshot."
  - id: T-SP4-2
    statement: "Under convexity and Slater, KKT solutions of the shared-resource relaxation are variational equilibria."
    scope: "Convex snapshot relaxation, not the nonlinear full trajectory problem."
  - id: T-SP4-3
    statement: "Projected primal-dual iterations approach an independent trust-constr convex-program reference within frozen gates."
    scope: "Audited snapshots and configured iteration budget."
  - id: T-SP4-4
    statement: "Smith, replicator and ERV-BNN preserve the simplex after numerical projection."
    scope: "Implemented population state; no global KKT claim for these protocols."
  - id: T-SP4-5
    statement: "The point-distance inflation bounds disk-footprint separation by the triangle inequality."
    scope: "Implemented circular robots, circular obstacles and fixed payload."

audit_gates:
  max_simplex_error: 1.0e-9
  max_capacity_violation: 0.08
  max_qp_potential_gap: 0.025
  max_potential_gradient_error: 1.0e-5
  min_initial_clearance_m: 0.0
  positions_repaired_after_integration: false

non_claims:
  - "The continuous relaxation solves globally optimal nonlinear multi-robot motion."
  - "The wrench-priority closure is fully distributed or integer-optimal."
  - "The alternating CBF projection is a monolithic CBF-QP."
  - "The barrier condition is automatically preserved after wheel-torque saturation; EXEC is re-audited."
  - "Finite ring consensus inherits the exact-information convergence theorem."
  - "The RVO proxy is a complete ORCA implementation."
  - "The experiment validates physical contact, friction or payload transport."
  - "The experiment does not validate robustness to wheel-torque saturation; v3 observed zero saturation events."