limitations:
- This is an integration pilot with only two paired seeds per scenario; it cannot
  establish a method ranking.
- The local auction is CBBA-like but is not a complete reproduction of CBBA bundle
  construction and convergence.
- Velocity sampling is neither exact ORCA nor nonlinear DMPC; names and plots retain
  the proxy qualifier.
- The central method optimizes each assignment snapshot and uses global obstacle observation,
  but it is not a certified joint space-time optimum.
- Navigation laws are sampled with forward Euler at dt=0.05 s; sampled collision audits
  do not prove continuous-time invariance.
- Controlled forklift and humans follow deterministic routes and apply a sampled safety
  stop before entering an occupied footprint.
- Loads are coupled kinematically to complete coalitions; contact, rigidity and wrench
  distribution are not simulated here.
