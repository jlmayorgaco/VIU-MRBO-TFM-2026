limitations:
  - Cardinality and nominal mass sharing do not certify support, rigidity, force or torque feasibility.
  - Loads are kinematically coupled to complete coalitions; no contact physics or wrench distribution is simulated.
  - Four-connected grid A* produces piecewise-linear axis-aligned interiors with short endpoint connectors; it is not a continuous-curvature planner.
  - Sampled reservations prevent modeled overlaps but do not prove continuous-time physical safety.
  - Replicator consensus is component-wise when the communication graph is disconnected.
