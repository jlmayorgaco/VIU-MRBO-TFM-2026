experiment_id: SP1_CANONICAL_CONFIRMATORY_v1
protocol_family: sp1_distributed_role_formation_v1
output_dir: results/sp1_canonical/SP1_CANONICAL_CONFIRMATORY_v1
regimes: [abundant, tight, scarce]
fleet_sizes: [8, 16]
load_counts: [2, 3]
seeds:
  start: 9200
  count: 30
network_cases:
  - name: sparse
    radius_m: 3.0
    gossip_rounds: 2
  - name: nominal
    radius_m: 5.0
    gossip_rounds: 4
  - name: dense
    radius_m: 15.0
    gossip_rounds: 1
methods:
  - local_gossip
  - local_no_gossip
  - local_no_switch_penalty
  - global_greedy
  - central_milp
cost_weights:
  distance: 0.55
  battery: 0.25
  switch_penalty: 0.20
  join: 0.04
  minimum_battery: 0.20
oracle_time_limit_s: 10.0
bootstrap_resamples: 2000
fail_on_audit: true
