campaign_id: SP1_SCALE_QPG_BENCHMARK_v2
preview_id: SP1_SCALE_QPG_BENCHMARK_v2_preview
schema_version: 1
branch: codex/sp1-scale-qpg-validation-v2
base_config: experiments/configs/sp1_tfm_final_quota_game_benchmark_v1.yaml
parallel_workers: 6
analysis_seed: 990101
output_dirs:
  preview: results/sp1_validation/SP1_SCALE_QPG_BENCHMARK_v2_preview
  full: results/sp1_validation/SP1_SCALE_QPG_BENCHMARK_v2

quota_bands:
  band05: {headroom_fraction_of_witness: 0.05}
  band10: {headroom_fraction_of_witness: 0.10}
  band20: {headroom_fraction_of_witness: 0.20}
  band30: {headroom_fraction_of_witness: 0.30}

methods:
  scalar:
    - Capacity-CBBA
    - Weighted-GRAPE
    - Weighted-Pair-GRAPE
    - Atomic-Quota-Logit
    - QPG-Logit-AR
    - QPG-Replicator-AR
    - SCALE-QPG-BR-LocalAR
    - SCALE-QPG-LogitBR-LocalAR
    - SCALE-QPG-LogitBR-GlobalAR
    - RandomSeed-AR
    - NearestCompatibleSeed-AR
    - LPSeed-AR
  oracles: [LP-oracle, MILP-oracle]
  services:
    - GRAPE-S
    - Pair-GRAPE-S
    - Capacity-CBBA-Services
    - QPG-Multiservice-Extension

scale:
  max_epochs:
    calibration: 120
    preview: 200
    full: 240
  max_wall_time_s:
    calibration: 15
    preview: 30
    full: 60
  max_proposals:
    calibration: 200000
    preview: 500000
    full: 1000000
  reservation_timeout_activations: 4
  stable_epochs_required: 1
  price_floor: 0.0
  payload_schema:
    proposal: {float64: 2, int64: 6}
    reservation: {float64: 1, int64: 5}
    commit: {float64: 2, int64: 5}
    rollback: {float64: 0, int64: 5}
    market_update: {float64: 4, int64: 2}
    active_set_update: {float64: 1, int64: 2}
    recovery: {float64: 2, int64: 5}
  local_recovery:
    max_nodes_per_augmentation: 50000
    max_wall_time_s: 1.0
    candidates_per_load: 30
    compress: false
    local_exchange: false

calibration:
