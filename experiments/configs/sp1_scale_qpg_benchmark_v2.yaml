      h: 2
      H: 8
    broad:
      L: 8
      T0: 0.16
      T_min: 0.005
      anneal: 0.995
      R_explore: 200
      rho_minus: 40.0
      rho_plus: 60.0
      gamma_switch: 0.25
      epsilon_improvement: 1.0e-9
