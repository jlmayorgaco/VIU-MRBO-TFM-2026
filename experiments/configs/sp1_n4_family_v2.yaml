  max_rounds: 4096

population_context:
  source: results/sp1_validation/SP1_DYNAMICS_BENCHMARK_v3/aggregated_results.csv
  experiment: e71
  topology: shared_dual
  interpretation: separate_model_and_campaign_not_directly_rankable

analysis:
  confidence_level: 0.95
  bootstrap_resamples: 4000
  bootstrap_seed: 2026081497
  independent_unit: world_seed
  multiplicity: Holm within each prespecified family

hypotheses:
  H4_1:
    question: Does a larger atomic neighbourhood reduce the MILP gap?
    contrast: geo_qpg_c3 minus geo_qpg_u on pairwise common support
  H4_2:
    question: Do Smith and LLL alter the BR quality-feasibility trade-off?
    contrasts: [geo_qpg_smith, geo_qpg_lll]
    comparator: geo_qpg_u
  H4_3:
    question: Does local DMIS plus TX preserve feasibility without global ordering?
    contrast: geo_qpg_d minus geo_qpg_cf
  H4_4:
    question: Does small-instance DPOP reproduce the certified MILP optimum?
    success_rule: identical feasibility and absolute objective error below 1e-8
  H4_5:
    question: What empirical growth is observed over the executed N-K range?
    interpretation: descriptive log-log slope; not an asymptotic complexity proof

limitations:
  - DMIS and TX are evaluated with reliable ordered delivery and no keeper crash.
  - DPOP is exact only inside the explicit profile limit and is not a scalable candidate.
  - Population dynamics use a different relaxed model and campaign; their numbers are contextual, not a direct ranking against atomic N4.
  - No N4 result establishes transport, contact stability, collision avoidance or global optimality of the distributed heuristics.
