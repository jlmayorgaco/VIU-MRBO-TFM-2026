experiment_id: CARGO_SYNTHETIC_CONTRACT_SMOKE_v1
protocol_family: coppelia_cargo_v1
mode: smoke
output_dir: results/cargo_synthetic_contract_smoke_v1
guards:
  - scalar_capacity
  - planar_lsq
  - supported_wrench_wheels

backend:
  kind: deterministic_contract
  scene_path: null
  host: 127.0.0.1
  port: 23000
  headless: true
  startup_timeout_s: 5.0

design:
  factors:
    payload_mass_kg: [28.0]
    friction_regime: [low]
    coalition: [minimal]
    longitudinal_acceleration_m_s2: [0.25]
  coalitions_m:
    minimal: [[-0.45, -0.30], [-0.45, 0.30], [0.45, 0.00]]
  friction_coefficients: {low: 0.22}
  motion_envelope:
    peak_lateral_acceleration_m_s2: 0.10
    peak_yaw_acceleration_rad_s2: 0.20
    peak_twist_world_m_s_rad_s: [0.45, 0.15, 0.25]
  perturbations:
    mass_relative_half_range: 0.01
    friction_absolute_half_range: 0.005
    com_jitter_m: 0.01
    initial_pose_jitter_m: 0.005
    initial_yaw_jitter_rad: 0.01
    sensor_noise_std_n: 0.0
  seeds: {start: 9001, count: 2}
  primary_dt_s: 0.05
  dt_sensitivity:
    values_s: [0.025, 0.05, 0.10]
    cell_indices: [0]
    seeds_per_cell: 1

payload:
  length_m: 1.10
  width_m: 0.75
  height_m: 0.25
  linear_damping_n_s_m: 2.0
  yaw_damping_n_m_s_rad: 0.5
  initial_pose_m_rad: [0.0, 0.0, 0.0]
  target_pose_m_rad: [0.40, 0.10, 0.05]

robot:
  count: 4
  payload_capacity_kg: 9.5
  wheel_radius_m: 0.0975
  track_width_m: 0.331
  max_wheel_speed_rad_s: 2.0
  max_drive_force_n: 12.0
  max_normal_force_n: 100.0

control:
  controller_id: cargo_pose_wrench_admittance_wheel_v2
  position_gain_s2: 0.55
  velocity_gain_s: 1.35
  yaw_gain_s2: 0.70
  yaw_rate_gain_s: 1.20
  heading_gain_s: 2.50
  allocation_regularization: 0.000001
  contact_force_admittance_m_s_per_n: 0.003
  wrench_force_admittance_m_s_per_n: 0.002
  wrench_torque_admittance_rad_s_per_n_m: 0.010
  admittance_twist_limit_fraction: 0.25
  horizon_s: 4.0
  series_stride: 1

gates:
  lsq_residual_max: 0.001
  sensor_static_relative_error_max: 0.02
  force_transmission_relative_error_max: 0.05
  wheel_twist_relative_error_max: 0.05
  contact_duty_min: 0.95
  max_relative_slip_m: 0.20
  final_position_error_m: 0.20
  final_yaw_error_rad: 0.20
  final_linear_speed_m_s: 0.30
  final_angular_speed_rad_s: 0.30
  dwell_time_s: 0.20
  collision_count_max: 0
  config_readback_abs_tolerance: 0.000001
  dt_final_position_spread_max_m: 1.00
  dt_final_yaw_spread_max_rad: 3.14
  dt_success_disagreement_max: 3
  paired_repeat_position_spread_max_m: 1.00
  paired_repeat_yaw_spread_max_rad: 3.14
  paired_success_disagreement_max: 3

inference:
  analysis_seed: 9917
  confidence_level: 0.95
  bootstrap_resamples: 1000
  holm_family: within_cell_and_endpoint
