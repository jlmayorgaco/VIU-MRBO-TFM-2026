schema_version: sp1-n3b-revision-fitness-v1
campaign_id: SP1_N3B_REVISION_FITNESS_v2
status: frozen_before_run
created_utc: 2026-08-21
base_seed: 2026081901

# ---------------------------------------------------------------------------
# POR QUE EXISTE ESTA CAMPANA
#
# N4 afirma que la reduccion grande de brecha procede de ampliar el ORDEN de la
# vecindad (h=1 -> h=2), y no de cambiar como se elige dentro de esa vecindad.
# Hasta ahora ese claim se apoya en una comparacion parcial: las variantes ASR y
# LLL se ejecutaron con un unico fitness, de modo que "regla de revision" y
# "fitness" nunca se separaron. Esta campana los cruza a h=1 fijo.
#
# Sin esta campana, N4 solo puede decir "las variantes evaluadas no reprodujeron
# la mejora". Con ella puede decir "ninguna combinacion de regla y fitness a h=1
# la reprodujo" -- si los datos lo sostienen. Si NO lo sostienen, el claim de N4
# debe debilitarse; ese resultado tambien es valido y se reporta igual.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ENMIENDA RESPECTO DE v1  (2026-08-21)
#
# v1 comparaba las nueve celdas contra la brecha que 2BR alcanza en la campana
# n4_v2. Eso es un contraste ENTRE POBLACIONES: el 14,8 % de referencia no se
# midio en estos 360 mundos, de modo que un intervalo de confianza calculado
# aqui no puede excluirlo en sentido inferencial. La revision lo detecto y el
# defecto es real.
#
# v2 anade el brazo de control que faltaba: 2BR con h = 2 sobre LOS MISMOS
# mundos, las mismas semillas, el mismo presupuesto y el mismo criterio de
# aceptacion, cruzado ademas con los tres fitness. El diseno pasa a 4 x 3 y el
# contraste primario pasa a ser PAREADO POR MUNDO.
#
# v1 no se borra: su RAW queda en n3b_v1 y sus cifras siguen siendo validas
# como descripcion de las nueve celdas unilaterales. Lo que se retira es la
# inferencia causal que se apoyaba en la referencia externa.
# ---------------------------------------------------------------------------

q_bar_kg: 5.0
workspace_m: [100.0, 100.0]

generator:
  capacity_distribution: lognormal_renormalized
  demand_split_alpha: 3.0
  source: sp1_n2_confirmatory.make_world   # el mismo generador, distinto flujo de semillas

# ---------------------------------------------------------------------------
# BANCO HOLD-OUT
#
# Flujo de semillas nuevo, no usado por ninguna campana previa. La disyuncion no
# puede garantizarse por rango porque las semillas de mundo se derivan por hash;
# se verifica por digest ANTES del analisis (ver acceptance.holdout_disjoint).
# ---------------------------------------------------------------------------
worlds:
  robot_count: 16
  load_count: 5
  capacity_cv: [0.00, 0.35, 0.65, 1.00]
  pressure: [0.85]
  scenarios: [uniform, clustered, separated, ring, corridor]
  seeds_per_cell: 18
  total_worlds: 360           # 4 x 1 x 5 x 18
  graph_regime: medium
  oracle_time_limit_s: 30.0

# ---------------------------------------------------------------------------
# DISENO FACTORIAL 3 x 3, ORDEN FIJO h = 1
# ---------------------------------------------------------------------------
strategic_order: [1, 2]       # h=1 en las nueve celdas; h=2 solo en el control

factors:
  strategic_order:
    h1: BR, ASR y LLL   # las nueve celdas de v1
    h2: 2BR             # brazo de control anadido en v2
  revision_rule:
    BR:  best response; acepta el maximo estricto
    ASR: sorteo proporcional a la mejora positiva
    LLL: respuesta log-lineal (Gibbs) con beta fijo
  fitness:
    F0: distancia          # g depende solo de d_ik
    F1: deficit            # g depende solo de la cobertura [m_k - Q_k]_+
    F2: marginal_geo_qpg   # utilidad marginal de (17), la de Geo-QPG

cells: 12                     # (3 reglas a h=1 + 2BR a h=2) x 3 fitness
runs_per_world: 13            # 12 celdas + oraculo MILP
total_runs: 4680

fixed_across_cells:
  beta_lll: 4.0
  max_rounds: 400
  tie_breaking: (delta_deficit, -distance, -robot_id)
  acceptance: lexicographic on (D4, J4)   # identica en las nueve celdas
  contract: heredado sin cambios de sp1_n3_confirmatory_v2.yaml

# ---------------------------------------------------------------------------
# HIPOTESIS PREESPECIFICADAS
# ---------------------------------------------------------------------------
hypotheses:
  primary:
    id: H-N3B.1v2
    null: >-
      sobre estos mismos mundos y con el mismo fitness, pasar de h=1 a h=2 no
      reduce la brecha mediana frente al MILP
    estimand: >-
      mediana de la diferencia pareada por mundo G(2BR,F) - G(BR,F), para cada
      fitness F, sobre los mundos en que ambas salidas son factibles y el
      oraculo certifico
    alternative: >-
      existe al menos una combinacion (regla, fitness) a h=1 cuya brecha mediana
      no es distinguible de la de 2BR
    decision: >-
      se rechaza H0 si el IC 95 % bootstrap de la diferencia pareada respecto de
      2BR contiene el cero para alguna celda, tras correccion de Holm sobre las
      nueve celdas
    consequence_if_rejected: >-
      el claim de N4 se debilita: la mejora deja de atribuirse en exclusiva al
      orden h y pasa a atribuirse a la combinacion evaluada
  secondary:
    id: H-N3B.2
    alternative: >-
      la eleccion de fitness cambia la brecha mas que la eleccion de regla
    test: >-
      efectos principales sobre la brecha en soporte comun; sin claim causal si
      hay interaccion significativa

metrics:
  primary:
    - integer_feasibility          # P(factible | oraculo factible), IC de Wilson
    - gap_vs_milp_common_support   # mediana + IC 95 % bootstrap pareado por mundo
  secondary:
    - bytes_per_amr
    - revisions_accepted
    - runtime_ms
    - stopping_criterion

analysis:
  confidence_level: 0.95
  bootstrap_resamples: 4000
  gap_requires: oracle_status == OPTIMAL and method feasible
  common_support: >-
    mundos en que las nueve celdas entregan salida factible y el oraculo
    certifico el optimo; se reporta su tamano junto a cada cifra
  multiplicity: Holm sobre las nueve celdas dentro de cada familia de contrastes
  no_post_hoc_tuning: >-
    ningun parametro de la tabla fixed_across_cells puede modificarse despues de
    observar resultados. Si hace falta cambiarlo, la campana se re-congela con
    nuevo campaign_id y las ejecuciones previas se marcan como piloto.

figure:
  count: 1
  kind: heatmap 3 x 3
  encodes: brecha mediana en soporte comun
  annotates: factibilidad por celda
  forbidden: nueve graficos separados

acceptance:
  holdout_disjoint: >-
    el conjunto de world_digest generado debe ser disjunto del de n1_v2, n2_v1,
    n3_v2, n4_v2, n4_v3 y n4_v4. Se comprueba antes de cualquier analisis y se
    aborta si la interseccion no es vacia.
  oracle_certified_fraction_min: 0.90
  report_regardless_of_sign: >-
    el resultado se reporta completo aunque contradiga el claim de N4
