limitations:
  - The navigation law is continuous, but its implementation is sampled with forward Euler at dt=0.05 s.
  - Cyclic CBF projection and sampled collision audits do not prove continuous-time invariance.
  - The local motion game uses left, right and wait primitives observed within the sensing radius; it is not a global shortest-path optimizer.
  - Dynamic obstacles are treated through their sampled positions without a velocity predictor in this pilot.
  - Cardinality and nominal mass sharing do not certify support, rigidity, force or torque feasibility.
  - Loads are kinematically coupled to complete coalitions; no contact physics or wrench distribution is simulated.
  - A sampled fallback guard is logged separately and must not be interpreted as part of the continuous controller.
