version: 0.1
review_type: systematic_mapping_plus_focused_slr

stages:
  title_abstract:
    default_decision: unscreened
    decisions:
      - include
      - exclude
      - maybe
    include_if_any:
      - id: robotics_multi_agent_core
        description: Multi-robot or multi-agent robotics/control/planning coordination.
      - id: cooperative_transport_core
        description: Cooperative transport, payload/object manipulation, rigid formation, or coalition transport.
      - id: theoretical_foundation_core
        description: Graph theory, game theory, distributed optimization, networked control, topology, geometry, CBF, MPC, or consensus with direct transfer to multi-agent robotics.
      - id: warehouse_AMR_core
        description: AMR, AMR, warehouse fleet, routing, dispatching, logistics, or pickup-delivery with autonomous mobile robots.
    exclude_if_any:
      - id: unrelated_domain
        description: No credible transfer to robotics, multi-agent control, coordination, or transport.
      - id: single_robot_only
        description: Single-robot perception/localization without multi-agent coordination relevance.
      - id: nontechnical_position
        description: Opinion, perspective, or broad essay without extractable technical method.
      - id: insufficient_metadata
        description: Title/abstract do not provide enough information and full text is unavailable.

  full_text:
    include_if_all:
      - id: extractable_method
        description: Mechanism, model, algorithm, or theoretical result can be extracted.
      - id: extractable_validation
        description: At least one of theorem, simulation, benchmark, real-robot experiment, or detailed argument is present.
    exclude_if_any:
      - id: no_multi_agent_relevance
        description: Full text confirms no multi-agent, distributed, networked, game-theoretic, or graph-theoretic relevance.
      - id: no_method_detail
        description: Claims are too vague to extract assumptions and method.
      - id: duplicate_or_superseded
        description: Duplicate, corrigendum only, or superseded version without unique contribution.

reason_codes:
  INCLUDE_CORE: Directly relevant to focused TFM question.
  INCLUDE_FOUNDATION: Theoretical foundation useful for the thesis.
  INCLUDE_MAPPING_ONLY: Useful for landscape mapping but probably not focused review.
  EXCLUDE_UNRELATED: Unrelated or weak transfer.
  EXCLUDE_SINGLE_ROBOT: Single-robot only, not useful for multi-agent review.
  EXCLUDE_NO_METHOD: No extractable method or evidence.
  EXCLUDE_DUPLICATE: Duplicate or superseded record.
  MAYBE_BORDERLINE: Needs full-text review.
  MAYBE_SURVEY: Survey/tutorial useful for taxonomy and citation chasing.

priority_rules:
  high:
    - cooperative transport
    - multi-robot manipulation
    - coalition formation
    - task allocation
    - distributed control
    - formation control
    - graph consensus
    - game theory
    - AMR warehouse
  medium:
    - MAPF
    - distributed optimization
    - MARL
    - CBF
    - MPC
    - networked systems
  low:
    - generic robotics
    - generic graph/network science
    - generic AI planning
